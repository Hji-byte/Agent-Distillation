[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-distillation"
version = "0.1.0"
description = "Math-focused agent distillation with Python code execution, built on smolagents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  # smolagents core
  "smolagents==1.26.0",
  "huggingface-hub>=1.27.0",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "jinja2>=3.1.4",
  "pillow>=12.2.0",
  "markdownify>=0.14.1",
  "python-dotenv>=1.0.1",
  # Teacher trajectory generation and experiment utilities
  "openai>=2.53.0",
  "datasets>=2.19.1",
  "numpy>=2.4.4",
  "pandas>=3.0.5",
  "pyyaml>=6.0.3",
  "tqdm>=4.66.5",
  "pebble>=5.2.1",
  "timeout-decorator>=0.5.0",
  "word2number>=1.1",
  "sympy==1.14.0",
  "antlr4-python3-runtime==4.11.1",
  # Local student model inference and fine-tuning
  "torch>=2.13.0",
  "torchvision>=0.28.0",
  "transformers>=5.15.0",
  "accelerate>=1.14.0",
  "trl==0.19.1",
  "peft>=0.20.0",
  "bitsandbytes",
  "safetensors>=0.8.0",
  # Evaluation and plotting
  "matplotlib>=3.11.1",
  "seaborn>=0.13.2",
  "latex2sympy2>=1.5.4",
]

[project.optional-dependencies]
quality = [
  "ruff>=0.9.0",
]
test = [
  "ipython>=8.31.0",
  "pytest>=8.1.0",
  "pytest-datadir",
]

[project.scripts]
smolagent = "smolagents.cli:main"
webagent = "smolagents.vision_web_browser:main"

[tool.pytest.ini_options]
addopts = "-sv --durations=0"

[tool.ruff]
line-length = 119
lint.ignore = [
  "F403",
  "E501",
]
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = [
  "E402",
]

[tool.ruff.lint.isort]
known-first-party = ["smolagents"]
lines-after-imports = 2

[tool.setuptools.package-data]
"smolagents.prompts" = ["*.yaml"]

[tool.setuptools]
packages = []

[tool.uv.sources]
smolagents = { path = "smolagents-1.26.0-fork", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
latex2sympy2 = { git = "https://github.com/QwenLM/Qwen2.5-Math.git", subdirectory = "evaluation/latex2sympy" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
